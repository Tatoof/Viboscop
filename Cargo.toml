[package]
name = "viboscop"
version = "0.1.0"
edition = "2021"
authors = ["GitHub Copilot"]
description = "Native desktop Viboscop stereo XY oscilloscope for WAV and FLAC audio files"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
cpal = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = { version = "0.31", features = ["default_fonts", "glow"] }
rfd = "0.15"
symphonia = { version = "0.5", features = ["wav", "flac", "mp3", "pcm"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.0"
